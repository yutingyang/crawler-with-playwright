[project]
name = "crawler-with-playwright"
version = "0.1.0"
description = "Study how Scribd renders documents (image + text layers) and rebuild pages as PDF"
readme = "README.md"
authors = [
    { name = "yutingyang", email = "t105310099@ntut.org.tw" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pymupdf>=1.28.2",
]

[project.scripts]
crawler-with-playwright = "crawler_with_playwright:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
